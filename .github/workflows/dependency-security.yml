# ============================================================
# .github/workflows/dependency-security.yml
# GitHub Actions — فحص التبعيات والتحديثات الأمنية
# يعمل جدولياً كل يوم الاثنين الساعة 9 صباحاً
# ============================================================

name: "Dependency & Security Monitoring"

on:
  schedule:
    - cron: "0 9 * * 1"    # كل يوم الاثنين الساعة 9 صباحاً UTC
  workflow_dispatch:          # يمكن تشغيله يدوياً

jobs:

  # ──────────────────────────────────────────────────────────
  # فحص التبعيات — V1
  # ──────────────────────────────────────────────────────────
  npm-audit-v1:
    name: "📦 npm Audit — Chess V1"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "Chess-V1/package-lock.json"

      - name: Install Dependencies
        working-directory: Chess-V1
        run: npm ci

      - name: npm Audit
        working-directory: Chess-V1
        run: |
          npm audit --audit-level=high \
            --json > npm-audit-v1.json || true
          npm audit --audit-level=high || true

      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-v1
          path: Chess-V1/npm-audit-v1.json
          retention-days: 30

      - name: Parse & Notify Slack
        if: always()
        run: |
          if [ -f Chess-V1/npm-audit-v1.json ]; then
            CRITICAL=$(cat Chess-V1/npm-audit-v1.json | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('metadata',{}).get('vulnerabilities',{}).get('critical',0))" 2>/dev/null || echo "0")
            HIGH=$(cat Chess-V1/npm-audit-v1.json | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('metadata',{}).get('vulnerabilities',{}).get('high',0))" 2>/dev/null || echo "0")
            echo "CRITICAL=$CRITICAL" >> $GITHUB_ENV
            echo "HIGH=$HIGH" >> $GITHUB_ENV
          fi

      - name: Slack Notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "📦 *npm Audit Weekly — Chess V1*\n🔴 Critical: *${{ env.CRITICAL }}* | 🟠 High: *${{ env.HIGH }}*\nراجع التفاصيل: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ──────────────────────────────────────────────────────────
  # فحص التبعيات — V2
  # ──────────────────────────────────────────────────────────
  npm-audit-v2:
    name: "📦 npm Audit — Chess V2"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "Chess-V2/package-lock.json"

      - name: Install Dependencies
        working-directory: Chess-V2
        run: npm ci

      - name: npm Audit
        working-directory: Chess-V2
        run: |
          npm audit --audit-level=high \
            --json > npm-audit-v2.json || true
          npm audit --audit-level=high || true

      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-v2
          path: Chess-V2/npm-audit-v2.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────
  # Trivy — فحص أسبوعي لآخر صور Docker
  # ──────────────────────────────────────────────────────────
  trivy-docker-images:
    name: "🐳 Weekly Docker Image Scan"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        image:
          - "YOUR_DOCKERHUB_USERNAME/chessv1:latest"
          - "YOUR_DOCKERHUB_USERNAME/chessv2:latest"

    steps:
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          severity: "HIGH,CRITICAL"
          format: "table"
          exit-code: "0"
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Trivy — SARIF
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          severity: "HIGH,CRITICAL"
          format: "sarif"
          output: "trivy-image.sarif"
          exit-code: "0"
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: "trivy-${{ matrix.image }}"

  # ──────────────────────────────────────────────────────────
  # Weekly Summary Report
  # ──────────────────────────────────────────────────────────
  weekly-summary:
    name: "📊 Weekly Security Report"
    runs-on: ubuntu-latest
    needs: [ npm-audit-v1, npm-audit-v2, trivy-docker-images ]
    if: always()

    steps:
      - name: Send Weekly Report to Slack
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "📊 *التقرير الأمني الأسبوعي*\n━━━━━━━━━━━━━━━━━━━━\n📦 npm Audit V1: ${{ needs.npm-audit-v1.result == 'success' && '✅' || '⚠️' }}\n📦 npm Audit V2: ${{ needs.npm-audit-v2.result == 'success' && '✅' || '⚠️' }}\n🐳 Docker Images: ${{ needs.trivy-docker-images.result == 'success' && '✅' || '⚠️' }}\n━━━━━━━━━━━━━━━━━━━━\n🔗 ${{ github.server_url }}/${{ github.repository }}/security"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

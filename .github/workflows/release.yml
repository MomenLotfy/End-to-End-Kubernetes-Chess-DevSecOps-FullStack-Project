# Wave 3 — trusted ECR release pipeline (build → scan → SBOM → push → sign → metadata).
# TRUSTED execution: push to main (post-merge, after `ci` gates) + manual dispatch only.
# NEVER runs on pull_request — forks cannot publish, sign, or assume the AWS role.
# The `production` environment pins deployments to main (owner configures it).
# Canonical identity is the immutable DIGEST; tags (sha-<short>) are navigation only.
# All third-party actions pinned to full commit SHAs (release tag in comment).

name: release

on:
  push:
    branches: [main]
    paths:
      - "Chess-Backend/**"
      - "Chess-Frontend/**"
      - "Database/**"
      - "docker-compose*.yml"
      - "release/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  # Never cancel a release mid-push; concurrent main pushes queue with distinct tags.
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: release (${{ matrix.name }})
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC: AWS role assumption + cosign keyless (Fulcio/Rekor)
      security-events: write # SARIF upload (trusted same-repo runs only)
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: Chess-Backend
            repo: chess-backend
          - name: frontend
            context: Chess-Frontend
            repo: chess-frontend
          - name: migration
            context: Database/migrations
            repo: chess-migration
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Preflight (role wiring present)
        run: |
          test -n "${{ vars.AWS_RELEASE_ROLE_ARN }}" \
            || { echo "Missing repository variable AWS_RELEASE_ROLE_ARN (see release/README.md)" >&2; exit 1; }
          echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (local, pre-push gate target)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: chess-${{ matrix.name }}:ci
          build-args: GIT_SHA=${{ github.sha }}

      - name: Trivy image scan (blocks on high/critical, pre-push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chess-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image-${{ matrix.name }}.sarif
          exit-code: "1"

      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-image-${{ matrix.name }}.sarif
          category: release-trivy-${{ matrix.name }}

      - name: SBOM (SPDX-JSON, Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: chess-${{ matrix.name }}:ci
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
          retention-days: 90

      - name: Assume AWS release role (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push to ECR (immutable tag + capture digest)
        id: push
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          TAG="sha-${SHORT_SHA}"
          REF="${REGISTRY}/${{ matrix.repo }}:${TAG}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag "chess-${{ matrix.name }}:ci" "$REF"
          docker push "$REF"
          DIGEST="$(aws ecr describe-images --repository-name "${{ matrix.repo }}" \
            --image-ids "imageTag=${TAG}" --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Bad digest: $DIGEST" >&2; exit 1; }
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed $REF@$DIGEST"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign digest (cosign keyless)
        env:
          IMAGE_REF: ${{ steps.push.outputs.registry }}/${{ matrix.repo }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Attest SBOM to digest
        env:
          IMAGE_REF: ${{ steps.push.outputs.registry }}/${{ matrix.repo }}@${{ steps.push.outputs.digest }}
        run: cosign attest --yes --predicate "sbom-${{ matrix.name }}.spdx.json" --type https://spdx.dev/Document "$IMAGE_REF"

      - name: Release metadata
        run: |
          set -euo pipefail
          read -r CRITICAL HIGH <<<"$(python3 - trivy-image-${{ matrix.name }}.sarif <<'EOF'
          import json, sys
          sarif = json.load(open(sys.argv[1]))
          run = sarif["runs"][0]
          sev = {i: r.get("properties", {}).get("security-severity", "") for i, r in enumerate(run["tool"]["driver"]["rules"])}
          c = h = 0
          for res in run.get("results", []):
              s = sev.get(res.get("ruleIndex", -1), "")
              if s.startswith("9") or s == "critical" or s.startswith("10"): c += 1
              elif s.startswith(("7", "8")) or s == "high": h += 1
          print(c, h)
          EOF
          )"
          bash release/make-metadata.sh \
            --name "${{ matrix.repo }}" \
            --registry "${{ steps.push.outputs.registry }}" \
            --tag "${{ steps.push.outputs.tag }}" \
            --digest "${{ steps.push.outputs.digest }}" \
            --commit "${{ github.sha }}" \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --sbom "sbom-${{ matrix.name }}.spdx.json" \
            --trivy-critical "$CRITICAL" --trivy-high "$HIGH" \
            --cosign-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            > "release-metadata-${{ matrix.name }}.json"
          cat "release-metadata-${{ matrix.name }}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata-${{ matrix.name }}
          path: release-metadata-${{ matrix.name }}.json
          retention-days: 90

  release-index:
    name: release-index
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-metadata-*
          merge-multiple: true
          path: metadata
      - name: Build release index
        run: |
          python3 - metadata > release-index.json <<'EOF'
          import json, glob, sys
          files = sorted(glob.glob(f"{sys.argv[1]}/release-metadata-*.json"))
          assert len(files) == 3, f"expected 3 metadata files, got {len(files)}"
          images = [json.load(open(f)) for f in files]
          commits = {i["source"]["commit"] for i in images}
          assert len(commits) == 1, "mixed commits in one release"
          print(json.dumps({"schema": "chess-release-index/v1",
                            "commit": images[0]["source"]["commit"],
                            "images": images}, indent=2))
          EOF
          cat release-index.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-index
          path: release-index.json
          retention-days: 90

  # Wave 5 — GitOps commit-back: write the 3 release digests into the SEPARATE
  # gitops repo (apps/chess/staging/images.yaml) so ArgoCD syncs staging.
  # Bootstrap behavior: if vars.GITOPS_REPO / secrets.GITOPS_REPO_TOKEN are
  # not configured yet, this job SKIPS with a visible notice (releases still
  # succeed; staging sync starts once the owner wires GitOps). Once
  # configured, failures are REAL failures (no continue-on-error).
  # Least privilege: a fine-grained PAT with contents:write on the gitops repo
  # ONLY (never the app repo, never admin). GITHUB_TOKEN is never used here.
  gitops-commit-back:
    name: gitops-commit-back
    runs-on: ubuntu-latest
    needs: [release-index]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-index
          path: gitops-input
      - name: Preflight (gitops wiring present?)
        id: preflight
        env:
          GITOPS_REPO: ${{ vars.GITOPS_REPO }}
          HAS_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN != '' }}
        run: |
          if [ -z "$GITOPS_REPO" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## gitops-commit-back: SKIPPED (bootstrap phase)"
              echo "Set vars.GITOPS_REPO + secrets.GITOPS_REPO_TOKEN to enable staging sync."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update gitops images.yaml + push
        if: steps.preflight.outputs.skip != 'true'
        env:
          GITOPS_REPO: ${{ vars.GITOPS_REPO }}
          GITOPS_REPO_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GITOPS_REPO_TOKEN}@github.com/${GITOPS_REPO}.git" gitops
          python3 release/gitops-commit-back.py \
            --images-yaml gitops/apps/chess/staging/images.yaml \
            --index gitops-input/release-index.json
          cd gitops
          git config user.name chess-release-bot
          git config user.email chess-release-bot@users.noreply.github.com
          git add apps/chess/staging/images.yaml
          if git diff --cached --quiet; then
            echo "No digest change; nothing to commit."
          else
            git commit -m "chore(staging): release ${{ github.sha }} digests"
            git push origin HEAD:main
          fi

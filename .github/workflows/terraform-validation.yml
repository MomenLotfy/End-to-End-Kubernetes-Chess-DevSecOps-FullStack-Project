# ============================================================
# .github/workflows/terraform-validation.yml
# GitHub Actions — فحص وتحقق ملفات Terraform تلقائياً
# يعمل على كل PR يُعدّل ملفات Terraform
# ============================================================

name: "Terraform — Validation & Security"

on:
  push:
    branches: [ master, main ]
    paths:
      - "EKS-TF/**"
      - "Jenkins-Server-TF/**"
      - ".github/workflows/terraform-validation.yml"
  pull_request:
    branches: [ master, main ]
    paths:
      - "EKS-TF/**"
      - "Jenkins-Server-TF/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ──────────────────────────────────────────────────────────
  # Validate EKS-TF
  # ──────────────────────────────────────────────────────────
  validate-eks:
    name: "☸️ Validate EKS-TF"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Format Check
        working-directory: EKS-TF
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init (بدون backend)
        working-directory: EKS-TF
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: EKS-TF
        run: terraform validate

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *EKS-TF Validation* — ${{ job.status }}\n*Branch:* ${{ github.ref_name }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  # ──────────────────────────────────────────────────────────
  # Validate Jenkins-Server-TF
  # ──────────────────────────────────────────────────────────
  validate-jenkins:
    name: "🏗️ Validate Jenkins-Server-TF"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Format Check
        working-directory: Jenkins-Server-TF
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init (بدون backend)
        working-directory: Jenkins-Server-TF
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: Jenkins-Server-TF
        run: terraform validate

  # ──────────────────────────────────────────────────────────
  # Security Scan على ملفات Terraform — tfsec
  # ──────────────────────────────────────────────────────────
  tfsec:
    name: "🔒 Terraform Security Scan (tfsec)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec — EKS-TF
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: EKS-TF
          format: sarif
          sarif_file: tfsec-eks.sarif
          soft_fail: true

      - name: Run tfsec — Jenkins-Server-TF
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: Jenkins-Server-TF
          format: sarif
          sarif_file: tfsec-jenkins.sarif
          soft_fail: true

      - name: Upload tfsec Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec-eks.sarif
          category: "tfsec-eks"

      - name: Upload Jenkins tfsec Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec-jenkins.sarif
          category: "tfsec-jenkins"

  # ──────────────────────────────────────────────────────────
  # Checkov — فحص أمني شامل لـ Terraform
  # ──────────────────────────────────────────────────────────
  checkov:
    name: "🔍 Checkov Infrastructure Security"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov — EKS-TF
        uses: bridgecrewio/checkov-action@master
        with:
          directory: EKS-TF
          framework: terraform
          output_format: sarif
          output_file_path: checkov-eks.sarif
          soft_fail: true

      - name: Run Checkov — Jenkins-Server-TF
        uses: bridgecrewio/checkov-action@master
        with:
          directory: Jenkins-Server-TF
          framework: terraform
          output_format: sarif
          output_file_path: checkov-jenkins.sarif
          soft_fail: true

      - name: Upload Checkov Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-eks.sarif
          category: "checkov-eks"

  # ──────────────────────────────────────────────────────────
  # Kubernetes Manifests Validation
  # ──────────────────────────────────────────────────────────
  validate-manifests:
    name: "📋 Validate Kubernetes Manifests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -output json \
            Manifest-file/*.yml Manifest-file/*.yaml \
            | tee kubeconform-results.json || true

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubeconform-results
          path: kubeconform-results.json
          retention-days: 7

      - name: Comment on PR — Manifests
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 📋 Kubernetes Manifests Validation\n\n';
            try {
              const results = JSON.parse(fs.readFileSync('kubeconform-results.json', 'utf8'));
              const valid = results.summary?.valid || 0;
              const invalid = results.summary?.invalid || 0;
              const errors = results.summary?.errors || 0;
              body += `| Valid | Invalid | Errors |\n|-------|---------|--------|\n`;
              body += `| ✅ ${valid} | ❌ ${invalid} | ⚠️ ${errors} |\n`;
            } catch(e) {
              body += '⚠️ لم يتم تحليل النتائج\n';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # ──────────────────────────────────────────────────────────
  # Summary Notification
  # ──────────────────────────────────────────────────────────
  summary:
    name: "📊 Summary"
    runs-on: ubuntu-latest
    needs: [ validate-eks, validate-jenkins, tfsec, checkov, validate-manifests ]
    if: always()

    steps:
      - name: Notify Slack — Infrastructure Summary
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "📊 *Infrastructure Validation Summary*\n━━━━━━━━━━━━━━━━━━\n☸️ EKS-TF Validate: ${{ needs.validate-eks.result == 'success' && '✅' || '❌' }}\n🏗️ Jenkins-TF Validate: ${{ needs.validate-jenkins.result == 'success' && '✅' || '❌' }}\n🔒 tfsec: ${{ needs.tfsec.result == 'success' && '✅' || '⚠️' }}\n🔍 Checkov: ${{ needs.checkov.result == 'success' && '✅' || '⚠️' }}\n📋 Manifests: ${{ needs.validate-manifests.result == 'success' && '✅' || '❌' }}\n━━━━━━━━━━━━━━━━━━\n*Branch:* ${{ github.ref_name }} | *By:* ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

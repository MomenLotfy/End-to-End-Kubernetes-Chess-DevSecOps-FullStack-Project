# Pre-commit — Wave 0, intentionally lightweight.
# This is a local convenience net, NOT a CI replacement (CI gates land in Wave 2).
# Install:  pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: no-commit-to-branch
        args: ["--branch=main", "--branch=master"]
  - repo: local
    hooks:
      - id: gitleaks-protect
        name: gitleaks protect staged changes
        entry: gitleaks protect --staged --redact --config .gitleaks.toml --verbose
        language: system
        pass_filenames: false
        always_run: true

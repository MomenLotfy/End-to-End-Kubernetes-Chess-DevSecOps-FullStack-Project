# ============================================================
# deployment-backend.yml
# Chess Backend — Deployment + Service
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-backend
  namespace: chess
  labels:
    app: chess-backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chess-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: chess-backend
        tier: backend
    spec:
      containers:
      - name: chess-backend
        image: YOUR_DOCKERHUB_USERNAME/chess-backend:1   # يُحدَّث تلقائياً
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
        - name: DB_HOST
          value: "chess-postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: chess-db-secret
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: chess-db-secret
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chess-db-secret
              key: db-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: chess-jwt-secret
              key: jwt-secret
        - name: FRONTEND_URL
          value: "http://chess-frontend-service"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop: [ALL]

---
apiVersion: v1
kind: Service
metadata:
  name: chess-backend-service
  namespace: chess
  labels:
    app: chess-backend
spec:
  selector:
    app: chess-backend
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
    name: http
  type: ClusterIP      # داخلي فقط — Frontend يصله من داخل الكتلة

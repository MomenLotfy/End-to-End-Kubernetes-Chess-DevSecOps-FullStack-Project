# Alertmanager: single replica (staging). Config comes from the ESO-templated
# Secret (webhook URL is secret); nvm silences live on emptyDir (a restart
# drops silences — accepted for staging, documented in chart README).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
    {{- include "obs.selectorLabels" (dict "component" "alertmanager") | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "obs.selectorLabels" (dict "component" "alertmanager") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "obs.labels" . | nindent 8 }}
        {{- include "obs.selectorLabels" (dict "component" "alertmanager") | nindent 8 }}
    spec:
      serviceAccountName: alertmanager
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: alertmanager
          image: {{ include "obs.image" (dict "registry" .Values.global.registry "repository" .Values.alertmanager.image.repository "tag" .Values.alertmanager.image.tag "digest" .Values.alertmanager.image.digest "context" "alertmanager") }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
          ports:
            - name: http
              containerPort: 9093
              protocol: TCP
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.alertmanager.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          secret: { secretName: chess-alertmanager-config }
        - name: data
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "obs.selectorLabels" (dict "component" "alertmanager") | nindent 4 }}
  ports:
    - name: http
      port: 9093
      targetPort: http
      protocol: TCP

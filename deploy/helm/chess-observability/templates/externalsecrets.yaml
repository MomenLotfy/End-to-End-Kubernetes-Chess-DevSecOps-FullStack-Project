# Two secrets from ONE owner-managed JSON (chess/staging/observability):
# 1. chess-observability: grafana admin user/password (env injection) — the
#    webhook URL is ALSO synced here as a plain key for runbook curl tests.
# 2. chess-alertmanager-config: the FULL alertmanager.yml rendered server-side
#    by ESO (the webhook URL cannot live in a ConfigMap). Route tree stays in
#    git (reviewable); only the URL value comes from Secrets Manager.
# NOTE: the {{ "{{ .alert_webhook_url }}" }} escape is ESO Go-template syntax
# (rendered by the ESO controller), NOT Helm — do not "fix" it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chess-observability
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.eso.secretStoreName }}
  target:
    name: chess-observability
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: grafana-admin-user
      remoteRef:
        key: {{ .Values.eso.observabilitySecretName | quote }}
        property: grafana-admin-user
    - secretKey: grafana-admin-password
      remoteRef:
        key: {{ .Values.eso.observabilitySecretName | quote }}
        property: grafana-admin-password
    - secretKey: alert-webhook-url
      remoteRef:
        key: {{ .Values.eso.observabilitySecretName | quote }}
        property: alert-webhook-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chess-alertmanager-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.eso.secretStoreName }}
  target:
    name: chess-alertmanager-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        alertmanager.yml: |
          global:
            resolve_timeout: 5m
          # Staging routing: critical pages the staging webhook; warning/info
          # aggregate silently (inspect in Grafana). NOTHING routes to prod
          # channels — no prod receiver exists in this file by design.
          route:
            receiver: staging-quiet
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - matchers: [severity = "critical"]
                receiver: staging-page
                group_wait: 10s
                repeat_interval: 30m
          receivers:
            - name: staging-quiet
            - name: staging-page
              webhook_configs:
                - url: "{{ "{{ .alert_webhook_url }}" }}"
                  send_resolved: true
                  max_alerts: 10
          inhibit_rules:
            - source_matchers: [severity = "critical"]
              target_matchers: [severity = "warning"]
              equal: [alertname, namespace]
  data:
    - secretKey: alert_webhook_url
      remoteRef:
        key: {{ .Values.eso.observabilitySecretName | quote }}
        property: alert-webhook-url

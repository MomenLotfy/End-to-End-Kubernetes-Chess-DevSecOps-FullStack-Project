# Prometheus configuration. SCRAPE SPLIT (deliberate, documented):
# - Alloy (DaemonSet) scrapes APP + K8s telemetry (backend, KSM, kubelets) and
#   remote-writes here. Job names below (backend/kube-state-metrics/kubelet)
#   are SET by Alloy relabeling — alerts depend on those exact names.
# - Prometheus scrapes ONLY the observability pipeline itself (self, alloy,
#   loki, alertmanager, grafana). Pipeline health must NEVER depend on Alloy:
#   if Alloy dies, up{job="alloy"}==0 still fires because THIS job is local.
# FALLBACK (if Alloy clustering misbehaves user-side): uncomment the direct
# backend/ksm jobs at the bottom AND disable Alloy metrics (chart README).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.evaluationInterval }}
      scrape_timeout: 10s
    rule_files:
      - /etc/prometheus/rules/*.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
          timeout: 10s
          api_version: v2
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]
      - job_name: alloy
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Values.namespace.name | quote }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: alloy
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:12345
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      - job_name: loki
        static_configs:
          - targets: ["loki:3100"]
      - job_name: alertmanager
        static_configs:
          - targets: ["alertmanager:9093"]
      - job_name: grafana
        static_configs:
          - targets: ["grafana:3000"]
    # FALLBACK (disabled): direct app/K8s scraping if the Alloy metrics path
    # is ever disabled (see header comment). NEVER enable while Alloy metrics
    # run — the same series from two paths corrupt ingestion.
    # - job_name: backend-direct
    #   static_configs:
    #     - targets: ["chess-backend.chess-staging.svc:5000"]
    # - job_name: ksm-direct
    #   static_configs:
    #     - targets: ["kube-state-metrics:8080"]
---
# Recording + alerting rules. Every alert carries severity + for-duration +
# summary/description + runbook_url (repo docs, stable links). Severity policy:
# critical = staging page (SLO/user impact or pipeline blind); warning =
# inspect in Grafana within the working day; info unused (no alert spam).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
data:
  recording.yml: |
    groups:
      - name: chess-api-recording
        interval: 30s
        rules:
          - record: api:http_request_rate5m
            expr: sum(rate(http_requests_total[5m]))
          - record: api:http_error_ratio5m
            expr: |
              sum(rate(http_requests_total{status_class="5xx"}[5m]))
              / clamp_min(sum(rate(http_requests_total[5m])), 0.0001)
          - record: api:http_error_ratio30m
            expr: |
              sum(rate(http_requests_total{status_class="5xx"}[30m]))
              / clamp_min(sum(rate(http_requests_total[30m])), 0.0001)
          - record: api:http_error_ratio1h
            expr: |
              sum(rate(http_requests_total{status_class="5xx"}[1h]))
              / clamp_min(sum(rate(http_requests_total[1h])), 0.0001)
          - record: api:http_error_ratio6h
            expr: |
              sum(rate(http_requests_total{status_class="5xx"}[6h]))
              / clamp_min(sum(rate(http_requests_total[6h])), 0.0001)
          - record: api:http_latency_p95_5m
            expr: |
              histogram_quantile(0.95,
                sum by (le) (rate(http_request_duration_seconds_bucket[5m])))
  alerts.yml: |
    groups:
      - name: chess-availability
        interval: 30s
        rules:
          - alert: ChessBackendDown
            expr: up{job="backend"} == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: Backend metrics gone (backend down or pipeline broken)
              description: up{job="backend"} has been 0 for 2m. Check pod state first, then Alloy.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/backend-unavailable.md
          - alert: ChessFrontendDown
            expr: |
              max by (deployment) (
                kube_deployment_status_replicas_available{deployment="chess-frontend", namespace="chess-staging"}
              ) == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: No available frontend replicas
              description: chess-frontend has zero available replicas for 2m (ALB serves 5xx).
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/backend-unavailable.md
          - alert: ChessHigh5xxRate
            expr: api:http_error_ratio5m > 0.05
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: API 5xx ratio above 5% (5m)
              description: 5xx ratio above 5% over 5m (SLO budget burns fast; see value labels).
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/high-5xx.md
          - alert: ChessHighLatency
            expr: api:http_latency_p95_5m > 1.5
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: API p95 latency above 1.5s (5m window, 10m)
              description: p95 above 1.5s over the 5m window for 10m. Likely DB or event-loop saturation.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/high-latency.md
          - alert: ChessSLOBurnFast
            expr: api:http_error_ratio1h > 0.144 and api:http_error_ratio5m > 0.144
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: SLO fast burn (14.4x budget, 1h+5m)
              description: "Error budget burns at >14x over 1h and 5m. Page: act now."
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/high-5xx.md
          - alert: ChessSLOBurnSlow
            expr: api:http_error_ratio6h > 0.06 and api:http_error_ratio30m > 0.06
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: SLO slow burn (6x budget, 6h+30m)
              description: Budget burns at >6x over 6h and 30m. Investigate today.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/high-5xx.md
          - alert: ChessRateLimitDegraded
            expr: sum(increase(rate_limit_degraded_total[10m])) > 10
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: Rate limiting failing open (>10 degraded limiter commands in 10m)
              description: Limiter Redis commands are failing; requests pass uncounted (no user impact, but auth endpoints are unthrottled). Check Valkey/ElastiCache health and redis_connected.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/rate-limit-degraded.md
      - name: chess-workloads
        interval: 30s
        rules:
          - alert: ChessPodCrashlooping
            expr: |
              max by (namespace, pod) (
                kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", namespace=~"chess-.*"}
              ) == 1
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: Pod crash-looping (see namespace/pod labels)
              description: Container in CrashLoopBackOff for 5m. Inspect previous logs.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/pod-crashloop.md
          - alert: ChessPodRestartingRepeatedly
            expr: |
              sum by (namespace, pod) (
                increase(kube_pod_container_status_restarts_total{namespace=~"chess-.*"}[1h])
              ) > 5
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: Pod restarted more than 5 times in 1h (see namespace/pod labels)
              description: Repeated restarts outside deploys signal flapping probes or OOM.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/pod-crashloop.md
          - alert: ChessContainerOOMKilled
            expr: |
              max by (namespace, pod, container) (
                kube_pod_container_status_last_terminated_reason{reason="OOMKilled", namespace=~"chess-.*"}
              ) == 1
            for: 1m
            labels: { severity: critical }
            annotations:
              summary: Container OOMKilled (see namespace/pod/container labels)
              description: Last termination was OOMKilled. Raise limits or fix the leak.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/oom-kill.md
          - alert: ChessDeploymentReplicasUnavailable
            expr: |
              max by (namespace, deployment) (
                kube_deployment_status_replicas_unavailable{namespace=~"chess-.*"}
              ) > 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: Deployment has unavailable replicas (see namespace/deployment labels)
              description: Unavailable replicas for 10m (failed rollout, readiness, or scheduling).
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/backend-unavailable.md
          - alert: ChessCPUSaturation
            expr: |
              sum by (namespace, pod) (
                rate(container_cpu_usage_seconds_total{namespace=~"chess-.*", container!=""}[5m])
              )
              / sum by (namespace, pod) (
                kube_pod_container_resource_limits{namespace=~"chess-.*", resource="cpu"}
              ) > 0.9
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: Pod CPU above 90% of limit for 15m (see namespace/pod labels)
              description: Sustained CPU saturation risks throttling/latency. Resize or scale.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/high-latency.md
          - alert: ChessMemorySaturation
            expr: |
              sum by (namespace, pod) (
                container_memory_working_set_bytes{namespace=~"chess-.*", container!=""}
              )
              / sum by (namespace, pod) (
                kube_pod_container_resource_limits{namespace=~"chess-.*", resource="memory"}
              ) > 0.9
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: Pod memory above 90% of limit for 15m (see namespace/pod labels)
              description: OOM risk. Inspect heap/usage before raising limits.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/oom-kill.md
          - alert: ChessMigrationFailed
            expr: |
              max by (job_name) (
                kube_job_status_failed{namespace="chess-staging", job_name="chess-migration"}
              ) > 0
            for: 1m
            labels: { severity: critical }
            annotations:
              summary: Migration Job failed (chess-migration)
              description: The ArgoCD PreSync migration failed. App did NOT deploy (ordering held). Fix forward.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/migration-failure.md
      - name: chess-dependencies
        interval: 30s
        rules:
          - alert: ChessDbPoolExhaustion
            expr: db_pool_connections{state="waiting"} > 2
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: DB pool waiters above 2 for 5m
              description: Queries queue for pool slots (pool=10). Check slow queries + RDS load.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/database-connectivity.md
          - alert: ChessDbErrorsHigh
            expr: sum(rate(db_query_errors_total[10m])) > 0.05
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: DB query errors sustained (10m)
              description: Query failures persist. Correlate with RDS CloudWatch + pool stats.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/database-connectivity.md
          - alert: ChessSocketAuthFailuresHigh
            expr: sum(rate(socket_io_auth_failures_total[5m])) > 0.5
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: Socket auth failures above 0.5/s (10m)
              description: Mass rejections suggest cookie/session breakage or credential probing.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/high-5xx.md
      - name: chess-observability
        interval: 30s
        rules:
          - alert: ChessAlloyDown
            expr: |
              count(up{job="alloy"} == 1) == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: No healthy Alloy replica (logs+metrics ingestion stopped)
              description: All Alloy DaemonSet pods are down/unscraped. Telemetry is blind.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/observability-stack-failure.md
          - alert: ChessMetricsPipelineStale
            expr: |
              absent(up{job="backend"}) or absent(up{job="kube-state-metrics"})
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: Alloy remote-write path stale (backend/KSM series absent)
              description: Expected Alloy-forwarded series are missing. Alloy alive but not shipping.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/observability-stack-failure.md
          - alert: ChessLokiDown
            expr: up{job="loki"} == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: Loki down (log queries + ingestion failing)
              description: Loki scrape failing for 2m. Logs accumulate nowhere — fix before app incidents.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/observability-stack-failure.md
          - alert: ChessAlertmanagerDown
            expr: up{job="alertmanager"} == 0
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: Alertmanager down (alerts evaluate but do not route)
              description: Firing alerts are not delivered. Restore routing promptly.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/observability-stack-failure.md
          - alert: ChessObsResourceExhaustion
            expr: |
              sum by (pod) (
                container_memory_working_set_bytes{namespace="chess-observability", container!=""}
              )
              / sum by (pod) (
                kube_pod_container_resource_limits{namespace="chess-observability", resource="memory"}
              ) > 0.9
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: Observability pod memory above 90% of limit (see pod label)
              description: The stack must never OOM itself. Resize before it degrades app telemetry.
              runbook_url: https://github.com/MomenLotfy/End-to-End-Kubernetes-Chess-DevSecOps-FullStack-Project/blob/main/docs/runbooks/observability-stack-failure.md

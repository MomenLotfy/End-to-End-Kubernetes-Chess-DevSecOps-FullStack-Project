# Prometheus: single-replica StatefulSet (staging; HA is a Wave 8 item).
# - Remote-write receiver ON (Alloy ships app+K8s series here).
# - Retention 15d on encrypted gp3 (values-tunable, bounded by design).
# - Runs as nobody (65534, the image default) + fsGroup for /prometheus.
# - Probes hit /-/healthy + /-/ready (no dependency on scrape targets).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
    {{- include "obs.selectorLabels" (dict "component" "prometheus") | nindent 4 }}
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      {{- include "obs.selectorLabels" (dict "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "obs.labels" . | nindent 8 }}
        {{- include "obs.selectorLabels" (dict "component" "prometheus") | nindent 8 }}
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          image: {{ include "obs.image" (dict "registry" .Values.global.registry "repository" .Values.prometheus.image.repository "tag" .Values.prometheus.image.tag "digest" .Values.prometheus.image.digest "context" "prometheus") }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            - --web.enable-remote-write-receiver
            - --web.listen-address=:9090
            - --query.lookback-delta=5m
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "obs.labels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storage.storageClassName }}
        resources:
          requests: { storage: {{ .Values.prometheus.storageSize }} }
---
# Headless service: stable DNS (prometheus:9090) without kube-proxy hops.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "obs.selectorLabels" (dict "component" "prometheus") | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP

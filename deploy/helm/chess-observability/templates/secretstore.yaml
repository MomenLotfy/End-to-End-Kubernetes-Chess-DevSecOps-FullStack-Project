# Obs SecretStore. Separate from the app store because SecretStores are
# namespaced; the credential is the same ESO controller IRSA role (its policy
# gains chess/staging/observability* in Terraform — least privilege preserved).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.eso.secretStoreName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.eso.region }}

# Dedicated ServiceAccount per component. Token automount is ON only where the
# workload calls the Kubernetes API (Alloy: node discovery; Prometheus: pod
# discovery; kube-state-metrics: resource reads). All others stay tokenless.
{{- range $sa := list "prometheus" "alertmanager" "loki" "grafana" "alloy" "kube-state-metrics" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    {{- include "obs.labels" $ | nindent 4 }}
{{- if has $sa (list "prometheus" "alloy" "kube-state-metrics") }}
automountServiceAccountToken: true
{{- else }}
automountServiceAccountToken: false
{{- end }}
{{- end }}

# ClusterIP ONLY. The name MUST stay chess-backend: the frontend nginx upstream
# dials `chess-backend:5000` (verified in the baked nginx.conf). No NodePort,
# no LoadBalancer, no ingress route — the backend is never directly public;
# external traffic reaches it exclusively through the frontend proxy.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.service.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "chess.componentLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "chess.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.backend.service.port }}
      targetPort: http

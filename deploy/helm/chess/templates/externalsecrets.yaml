# Two synced secrets, two trust levels:
# - chess-db-master: RDS master credentials (RDS-managed secret). Consumed ONLY
#   by the migration Job (DDL + GRANTs need ownership). The backend NEVER sees
#   master credentials.
# - chess-app: owner-managed JSON secret (chess/staging/app). Consumed ONLY by
#   the backend (least-privilege app user + JWT + SMTP + origins + RDS CA).
#   Whole-document extract: every JSON field becomes a same-named secret key.
# Secret rotation: ESO re-syncs on refreshInterval; pods need a restart to pick
# up rotated values (documented; Wave 6+ may add reloader — explicitly NOT here).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chess-db-master
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "chess.labels" . | nindent 4 }}
  annotations:
    # PreSync (wave -2, persistent): synced BEFORE the migration Job (wave -1).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.eso.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.eso.secretStoreName }}
  target:
    name: chess-db-master
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "eso.rdsMasterSecretArn is required (Terraform output rds_master_user_secret_arn)" .Values.eso.rdsMasterSecretArn | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ required "eso.rdsMasterSecretArn is required (Terraform output rds_master_user_secret_arn)" .Values.eso.rdsMasterSecretArn | quote }}
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chess-app
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "chess.labels" . | nindent 4 }}
    chess/secret-class: application
  annotations:
    # PreSync (wave -2, persistent): synced BEFORE the migration Job (wave -1).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.eso.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.eso.secretStoreName }}
  target:
    name: chess-app
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.eso.appSecretName }}
# Wave 7: chess-redis holds the Valkey AUTH credential ({username,password}
# JSON in Secrets Manager -> same-named keys). Consumed ONLY by the backend
# (Phase 3+: socket adapter, rate limiter, rematch votes). The migration Job
# and frontend NEVER reference it (asserted by wave7-static-checks.py); no
# Role grants secret reads, so unrelated ServiceAccounts cannot fetch it.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chess-redis
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "chess.labels" . | nindent 4 }}
    chess/secret-class: application
  annotations:
    # PreSync (wave -2, persistent): synced BEFORE the migration Job (wave -1).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.eso.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.eso.secretStoreName }}
  target:
    name: chess-redis
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "eso.redisSecretArn is required (Terraform output redis_user_secret_arn)" .Values.eso.redisSecretArn | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ required "eso.redisSecretArn is required (Terraform output redis_user_secret_arn)" .Values.eso.redisSecretArn | quote }}
        property: password

# Namespaced SecretStore (NOT ClusterSecretStore): this trust reaches only the
# chess-staging namespace. No `auth` block on purpose — the ESO controller
# authenticates with its own IRSA role (Terraform output eso_role_arn), which
# can read EXACTLY the two staging secrets. Blast radius is enforced in IAM,
# not in YAML: even a malicious SecretStore in this namespace cannot read
# anything else.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.eso.secretStoreName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "chess.labels" . | nindent 4 }}
  annotations:
    # PreSync (wave -2, persistent): the store must exist before the migration
    # Job (wave -1) so ESO can sync Secrets the Job needs. No delete policy:
    # this hook persists as a regular object after every sync.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.global.awsRegion }}

# Dedicated ServiceAccounts per workload. The default ServiceAccount is never
# used. Token automount is disabled: no workload calls the Kubernetes API.
# Wave 7: chess-backend carries the IRSA annotation (avatar S3 objects only)
# when aws.backendRoleArn is set. The EKS webhook injects the web-identity
# token volume + env; the pod holds no static AWS credentials.
{{- range $sa := list "chess-backend" "chess-frontend" "chess-migration" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    {{- include "chess.labels" $ | nindent 4 }}
  {{- if and (eq $sa "chess-backend") $.Values.aws.backendRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $.Values.aws.backendRoleArn | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}

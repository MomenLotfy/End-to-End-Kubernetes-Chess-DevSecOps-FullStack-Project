# Uploads persistence (staging): EBS gp3 via the CSI driver. Without this PVC,
# every backend restart would wipe avatars (Single replica + Recreate + fresh
# emptyDir). 2Gi is generous for avatar JPEGs; expansion is allowed.
# - encrypted: EBS encryption at rest (account default aws/ebs key; a CMK
#   binding is a Wave 8 compliance hardening, not a staging need).
# - WaitForFirstConsumer: the volume is provisioned in the pod's AZ, so the
#   single backend pod can always attach it (2-AZ cluster correctness).
# - reclaim Delete: staging cadence reaps orphaned volumes; avatars are
#   re-uploadable user content, not system state. Wave 7 moves this to S3.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storage.className }}
  labels:
    {{- include "chess.labels" . | nindent 4 }}
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chess-uploads
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "chess.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests:
      storage: {{ .Values.backend.uploads.size }}
